# Supervised pretraining: 6 residual blocks x 64 filters (no SE: SE halves throughput on Apple MPS).
run_dir: runs/sl_small
train_data: [data/shards/train]
val_data: [data/shards/val]
model:
  blocks: 6
  filters: 64
  se_ratio: 0
  value_head: wdl
batch_size: 1024
steps: 30000            # ~31M positions, ~0.8 epoch of the 2025-01 slice (sized to the local compute budget)
optimizer: adamw
lr: 0.002
min_lr_ratio: 0.02
warmup_steps: 1000
weight_decay: 0.01
value_weight: 0.5    # value targets are game results shared by ~80 correlated positions; down-weight to limit overfitting
grad_clip: 10.0
amp: true
ema_decay: 0.999
workers: 4
log_every: 100
val_every: 2000
val_positions: 200000
ckpt_every: 2000
snapshot_every: 4000
seed: 0
