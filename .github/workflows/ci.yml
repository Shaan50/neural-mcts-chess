name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        env:
          NEURAL_MCTS_CHESS_NATIVE: "0"   # portable build flags on shared runners
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu || pip install torch
          pip install -e ".[dev]"
          python setup.py build_ext --inplace
          python -c "import neural_mcts_chess._core as c; print('C++ core OK, perft(4) =', c.Position().perft(4))"
      - name: Lint
        run: ruff check neural_mcts_chess tests && ruff format --check neural_mcts_chess tests
      - name: Tests
        run: pytest -q -p no:warnings
